<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahjong Master: Zen Edition</title>
    <style>
        :root { --bg: #04140a; --table: #1a5a35; --accent: #ffcc00; --white: #fdfdfd; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: white; font-family: "Hiragino Mincho ProN", serif; overflow: hidden; height: 100vh; }
        
        #game-screen { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle, var(--table) 0%, #051a10 100%); display: flex; align-items: center; justify-content: center; }

        /* --- 牌のグラフィック --- */
        .tile { 
            width: 38px; height: 54px; background: #fff; border-radius: 4px; 
            border: 1px solid #999; border-bottom: 6px solid #bbb;
            display: flex; align-items: center; justify-content: center;
            position: relative; cursor: pointer; box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .tile:hover { transform: translateY(-5px); }
        .tile.hidden { background: linear-gradient(135deg, #3d7a55 0%, #1a3a2a 100%); border-bottom-color: #0d1a13; }
        .tile.dora { box-shadow: 0 0 15px var(--accent); border-color: var(--accent); }
        .tile.tsumo { margin-left: 12px; }

        .design { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; }
        
        /* 萬子・字牌 */
        .txt-val { font-size: 22px; font-weight: 900; line-height: 1; }
        .m-color { color: #d32f2f; }
        .z-green { color: #2e7d32; }
        .z-red { color: #d32f2f; }
        .z-black { color: #222; }
        .suit-label { font-size: 9px; color: #666; margin-top: 1px; }

        /* 筒子（ドット） */
        .p-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #1976d2; border: 1px solid rgba(0,0,0,0.1); }
        .dot.v1 { width: 22px; height: 22px; border: 3px double #fff; outline: 1px solid #1976d2; }

        /* 索子（竹） */
        .s-box { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; width: 26px; }
        .bamboo { width: 5px; height: 16px; background: #2e7d32; border-radius: 1px; border: 1px solid #1b5e20; position: relative; }
        .bamboo.red { background: #d32f2f; }

        /* --- 演出エリア --- */
        #effect-layer { position: fixed; inset: 0; pointer-events: none; z-index: 500; display: flex; align-items: center; justify-content: center; }
        .flash-msg { font-size: 100px; font-style: italic; font-weight: 900; color: white; text-shadow: 0 0 20px red; opacity: 0; transform: scale(0.5); }
        
        @keyframes riichi-anim {
            0% { opacity: 0; transform: scale(0.2) rotate(-10deg); }
            50% { opacity: 1; transform: scale(1.1) rotate(0deg); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* --- リザルト画面 --- */
        #result-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; 
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .yaku-row { font-size: 24px; color: var(--accent); margin: 5px; opacity: 0; transform: translateX(-20px); }
        .show-yaku { animation: slideIn 0.5s forwards; }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }

        /* --- レイアウト --- */
        .player-area { position: absolute; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .south { bottom: 20px; }
        .river { display: grid; grid-template-columns: repeat(6, 22px); gap: 2px; height: 80px; margin-bottom: 10px; }
        .river .tile { width: 22px; height: 32px; border-bottom-width: 2px; font-size: 10px; }
        
        #controls { position: absolute; bottom: 160px; display: flex; gap: 10px; }
        button { 
            padding: 12px 24px; border-radius: 30px; border: none; background: #333; color: white; 
            font-weight: bold; font-size: 18px; display: none; cursor: pointer; box-shadow: 0 4px 0 #000;
        }
        button.active { display: block; background: linear-gradient(#f39c12, #e67e22); }
    </style>
</head>
<body>

<div id="game-screen">
    <div id="effect-layer"><div id="riichi-text" class="flash-msg">REACH!</div></div>

    <div id="controls">
        <button id="btn-riichi" onclick="playRiichi()">リーチ</button>
        <button id="btn-win" onclick="playWin()">和了</button>
    </div>

    <div class="player-area south">
        <div class="river" id="my-river"></div>
        <div id="riichi-stick" style="width:80px; height:8px; background:#eee; border-radius:4px; margin-bottom:10px; display:none; position:relative; border-bottom:2px solid #ccc;">
            <div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:4px; height:4px; background:red; border-radius:50%;"></div>
        </div>
        <div class="hand" id="my-hand" style="display:flex; gap:2px;"></div>
    </div>
</div>

<div id="result-overlay">
    <h1 id="win-type" style="font-size: 60px; margin-bottom: 10px;">榮</h1>
    <div id="yaku-list"></div>
    <div id="score-display" style="font-size: 48px; margin-top: 20px; border-top: 1px solid #555; padding-top: 10px;">8000</div>
    <button class="active" style="margin-top:40px;" onclick="location.reload()">次局へ</button>
</div>

<script>
const KANJI = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
const JIHAI = { "E": "東", "S": "南", "W": "西", "N": "北", "P": "白", "F": "發", "C": "中" };

function createTileHTML(tile, isTsumo = false) {
    let content = '';
    const doraClass = tile.dora ? 'dora' : '';
    const tsumoClass = isTsumo ? 'tsumo' : '';

    if (tile.c === 'm') {
        content = `<div class="design"><span class="txt-val m-color">${KANJI[tile.v]}</span><span class="suit-label">萬</span></div>`;
    } 
    else if (tile.c === 'p') {
        let dots = '';
        for(let i=0; i<tile.v; i++) dots += `<div class="dot ${tile.v===1?'v1':''}"></div>`;
        content = `<div class="design"><div class="p-grid" style="grid-template-columns: repeat(${tile.v===1?1:2}, 1fr)">${dots}</div></div>`;
    } 
    else if (tile.c === 's') {
        let sticks = '';
        for(let i=0; i<tile.v; i++) sticks += `<div class="bamboo"></div>`;
        content = `<div class="design"><div class="s-box">${sticks}</div></div>`;
    }
    else if (tile.c === 'z') {
        let zClass = 'z-black';
        if(tile.v === 'F') zClass = 'z-green';
        if(tile.v === 'C') zClass = 'z-red';
        let char = JIHAI[tile.v];
        if(tile.v === 'P') char = ''; // 白は何もなし
        content = `<div class="design" style="${tile.v === 'P' ? 'border:1px solid #ddd; margin:4px; border-radius:2px;' : ''}"><span class="txt-val ${zClass}">${char}</span></div>`;
    }

    return `<div class="tile ${doraClass} ${tsumoClass}">${content}</div>`;
}

// デモ用の手牌生成
const myHand = [
    {c:'z', v:'E'}, {c:'z', v:'E'}, {c:'z', v:'E'}, // 東
    {c:'z', v:'C'}, {c:'z', v:'C'}, // 中
    {c:'m', v:2}, {c:'m', v:3}, {c:'m', v:4},
    {c:'p', v:1, dora: true}, {c:'p', v:1}, 
    {c:'s', v:6}, {c:'s', v:7}, {c:'s', v:8},
    {c:'z', v:'F'} // ツモ牌
];

const handDiv = document.getElementById('my-hand');
myHand.forEach((t, i) => {
    handDiv.innerHTML += createTileHTML(t, i === myHand.length - 1);
});

// UI制御
setTimeout(() => { document.getElementById('btn-riichi').classList.add('active'); }, 1000);
setTimeout(() => { document.getElementById('btn-win').classList.add('active'); }, 2000);

function playRiichi() {
    const text = document.getElementById('riichi-text');
    text.style.animation = 'riichi-anim 0.8s forwards';
    setTimeout(() => {
        document.getElementById('riichi-stick').style.display = 'block';
        document.getElementById('btn-riichi').classList.remove('active');
    }, 400);
}

function playWin() {
    const overlay = document.getElementById('result-overlay');
    const yakuList = document.getElementById('yaku-list');
    overlay.style.display = 'flex';
    
    const yakus = ["立直", "門前清自摸和", "役牌:東", "ドラ 1"];
    yakus.forEach((y, i) => {
        const div = document.createElement('div');
        div.className = 'yaku-row';
        div.innerText = y;
        yakuList.appendChild(div);
        setTimeout(() => div.classList.add('show-yaku'), i * 400);
    });
}
</script>
</body>
</html>
